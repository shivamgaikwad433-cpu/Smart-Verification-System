[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api requests to the Render.com backend.
# UPDATE: Replace the Render URL below after creating your Render service.
[[redirects]]
  from = "/api/*"
  to = "https://smart-verification-api.onrender.com/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Forwarded-Host = "smart-verification-api.onrender.com"

# SPA fallback — all other routes serve index.html for React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & caching headers for all pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


